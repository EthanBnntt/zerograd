[project]
name = "zerograd"
version = "0.2.0"
description = "JAX and Optax primitives for zero-gradient evolutionary optimization."
readme = "README.md"
authors = [
    { name = "Bennett", email = "EthanBnntt@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # CPU jaxlib by default. Pick exactly one GPU extra for CUDA / ROCm.
    "jax>=0.10.2",
    "optax>=0.2.8",
    "flax>=0.12.0",
]

[project.optional-dependencies]
# Backend extras mirror upstream JAX extras. Install only one GPU backend.
cpu = [
    "jax[cpu]>=0.10.2",
]
cuda = [
    "jax[cuda12]>=0.10.2",
]
cuda12 = [
    "jax[cuda12]>=0.10.2",
]
cuda13 = [
    "jax[cuda13]>=0.10.2",
]
cuda12-local = [
    "jax[cuda12-local]>=0.10.2",
]
cuda13-local = [
    "jax[cuda13-local]>=0.10.2",
]
rocm7 = [
    "jax[rocm7-local]>=0.10.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "basedpyright",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "examples"]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
]

# GPU backends are mutually exclusive — selecting more than one is an error.
[tool.uv]
conflicts = [
    [
        { extra = "cuda" },
        { extra = "cuda12" },
        { extra = "cuda13" },
        { extra = "cuda12-local" },
        { extra = "cuda13-local" },
        { extra = "rocm7" },
    ],
]
